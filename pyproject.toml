[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hormone_cycler"
version = "0.1.0"
description = "Data-calibrated menstrual cycle simulator with validation and SVG visualization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "pyarrow",
  "matplotlib",
  "joblib",
]
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]

[project.scripts]
hormone_cycler = "hormone_cycler.cli:main"
vis_cycles = "hormone_cycler.visualization:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
